<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <header>Captcha Generator</header>
        <div class="input-field captcha-box">
            <input type="text" value="5 x 8 P 0" disabled />
            <button class="refresh-btn">
                <i class="fa fa-solid fa-rotate-right"></i>
            </button>
        </div>
        <div class="input-field captcha-input">
            <input type="text" placeholder="Enter captcha">
        </div>
        <p class="message">Entered captcha is correct</p>
        <div class="input-field btn disabled">
            <button>Submit Captcha</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
